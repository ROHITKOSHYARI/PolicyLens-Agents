services:
  gateway:
    build:
      context: ./gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-policylens}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policylens}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-policylens-local-only}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      AGENT_SERVICE_URL: http://agent-service:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10MB}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      UPLOAD_DIRECTORY: /data/uploads
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    read_only: true
    volumes:
      - gateway_uploads:/data/uploads
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  agent-service:
    build:
      context: ./agent-service
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RETRIEVAL_EAGER_INIT: "true"
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      RRF_K: ${RRF_K:-60}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    volumes:
      - agent_data:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policylens}
      POSTGRES_USER: ${POSTGRES_USER:-policylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policylens-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    command: ["--memory.max-traces", "5000"]
    expose:
      - "4317"
      - "4318"
      - "16686"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"

volumes:
  postgres_data:
  gateway_uploads:
  agent_data:
